<tr class="event">
  <td>
    <h3 style="margin: 0">$if(date)$ $date$: $endif$ $title$ </h3>
    <table class="event-info">
      $if(who)$<tr><th>Wer:</th><td>$who$</td></tr>$endif$
      $if(where)$<tr><th>Wo:</th><td>$where$</td></tr>$endif$
      $if(time)$<tr><th>Wann:</th><td>$time$</td></tr>$endif$
    </table>
    $body$
  </td>
</tr>

<tr class="event">
  <td>
    <h3 style="margin: 0">$if(date)$ $date$: $endif$ $title$ </h3>
    <table class="event-info">
      $if(who)$<tr><th>Who:</th><td>$who$</td></tr>$endif$
      $if(where)$<tr><th>Where:</th><td>$where$</td></tr>$endif$
      $if(time)$<tr><th>When:</th><td>$time$</td></tr>$endif$
    </table>
    $body$
  </td>
</tr>
